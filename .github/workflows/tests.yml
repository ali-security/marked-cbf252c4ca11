name: "Tests"
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional jasmine spec-name filter; empty runs the full suite"
        required: false
        default: ""

jobs:
  Test:
    strategy:
      fail-fast: false
      matrix:
        # Node 8 is dropped: the pinned test runner (jasmine 3.7.0) loads
        # lib/loader.js, which uses dynamic `import()` — a SyntaxError on
        # Node 8, so the suite cannot start there at all.
        node_version: ['14']
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node_version }}
      - name: Install Dependencies
        run: npm ci
      - name: Run Unit Tests 👩🏽‍💻
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            npm run test:unit -- --filter="${{ inputs.test-filter }}"
          else
            npm run test:unit
          fi
      - name: Run Spec Tests 👩🏽‍💻
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            npm run test:specs -- --filter="${{ inputs.test-filter }}"
          else
            npm run test:specs
          fi
      - name: Match the npm that packed the release
        if: matrix.node_version == '14'
        run: npm i -g npm@7.12.0
      - name: Pack 📦
        if: matrix.node_version == '14'
        run: npm pack
      - name: Upload Package Tarball
        if: matrix.node_version == '14'
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: marked-*.tgz
          if-no-files-found: error
